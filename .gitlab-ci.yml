variables:
  IMAGE_TAG: ${CI_COMMIT_TAG}_${CI_COMMIT_SHORT_SHA}

stages:
  - buildandpush
  - deploy
  - showlog

buildandpush:
  stage: buildandpush
  variables:
    GIT_STRATEGY: clone
  before_script:
    - printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" --username "$REGISTRY_USER" --password-stdin
  script:
    - docker compose build --pull
    - docker compose push be fe
  tags:
    - lab-server
  only:
    - tags

deploy:
  stage: deploy
  variables:
    GIT_STRATEGY: fetch
  resource_group: restaurant-production
  when: manual
  before_script:
    - printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" --username "$REGISTRY_USER" --password-stdin
  script:
    - docker compose pull
    - docker compose up -d --no-build --remove-orphans --wait --wait-timeout 240
  after_script:
    - docker compose ps --all
    - docker compose logs --tail=100 be fe
  tags:
    - lab-server
  only:
    - tags

showlog:
  stage: showlog
  variables:
    GIT_STRATEGY: fetch
  when: manual
  script:
    - docker compose ps --all
    - docker compose logs --tail=100 be fe
  tags:
    - lab-server
  only:
    - tags
