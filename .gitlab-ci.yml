variables:
  IMAGE_TAG: ${CI_COMMIT_TAG}_${CI_COMMIT_SHORT_SHA}

stages:
  - buildandpush
  - deploy
  - showlog

buildandpush:
  stage: buildandpush
  variables:
    GIT_STRATEGY: clone
  before_script:
    - docker login ${REGISTRY_URL} -u ${REGISTRY_USER} -p ${REGISTRY_PASSWORD}
  script:
    - docker compose build
    - docker compose push
  tags:
    - lab-server
  only:
    - tags

deploy:
  stage: deploy
  variables:
    GIT_STRATEGY: none
  before_script:
    - docker login ${REGISTRY_URL} -u ${REGISTRY_USER} -p ${REGISTRY_PASSWORD}
  script:
    - docker compose pull
    - docker compose down
    - docker compose up -d --remove-orphans
    - docker image prune -f
  tags:
    - lab-server
  only:
    - tags

showlog:
  stage: showlog
  variables:
    GIT_STRATEGY: none
  script:
    - sleep 20
    - docker ps
    - docker logs mybe --tail=100
    - docker logs myfe --tail=100
  tags:
    - lab-server
  only:
    - tags

