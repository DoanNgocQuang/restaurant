services:
  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    container_name: mydb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: restaurant
      MYSQL_PASSWORD: restaurant
      MYSQL_DATABASE: restaurant
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - my-network

  be:
    image: ${REGISTRY_URL}/${REGISTRY_USER}/${REGISTRY_PROJECT}-be:${IMAGE_TAG}
    build: ./backend
    container_name: mybe
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/restaurant
      SPRING_DATASOURCE_USERNAME: restaurant
      SPRING_DATASOURCE_PASSWORD: restaurant
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - my-network

  fe:
    image: ${REGISTRY_URL}/${REGISTRY_USER}/${REGISTRY_PROJECT}-fe:${IMAGE_TAG}
    build: ./frontend
    container_name: myfe
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - be
    networks:
      - my-network

volumes:
  db_data:

networks:
  my-network:
    driver: bridge
